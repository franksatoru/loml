<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kejutan Ulang Tahun</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2a1448;--bg2:#12082a;--gold:#ffcf6b;--pink:#ff8fb1;--mint:#7de0c4;--cream:#fff4e6;--ink:#2a1448;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1448;--bg2:#12082a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--cream);background:linear-gradient(rgba(18,8,42,.55),rgba(18,8,42,.55)),url("nanad.png") center/cover no-repeat fixed,radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));overflow:hidden}
/* ^ GANTI "background.jpg" dengan nama file foto latar kamu. Angka .55 = gelap/terangnya lapisan (0 = terang, 1 = gelap) */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;transition:opacity .6s}
.hidden{opacity:0;pointer-events:none;visibility:hidden}
h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(2rem,7vw,3.2rem);margin:0 0 6px;color:var(--gold);text-shadow:0 4px 0 #b4503a,0 10px 24px rgba(0,0,0,.4)}
p{margin:0 0 16px;opacity:.9}
.box{background:rgba(255,255,255,.08);border:2px solid rgba(255,207,107,.5);border-radius:24px;padding:28px 26px;width:min(92vw,340px);backdrop-filter:blur(8px);box-shadow:0 20px 50px rgba(0,0,0,.4)}
input{width:100%;padding:12px 16px;margin-bottom:12px;border-radius:14px;border:2px solid transparent;font:inherit;font-size:1rem;background:var(--cream);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
button{font:inherit;font-weight:700;font-size:1.05rem;padding:12px 26px;border:0;border-radius:999px;background:var(--gold);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 #c08a2c;transition:transform .1s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #c08a2c}
#err{color:var(--pink);min-height:1.4em;margin:0 0 8px;font-size:.95rem}
/* kue 3D */
.stage{perspective:900px;margin:10px 0 18px}
.cake{position:relative;width:260px;height:250px;transform-style:preserve-3d;cursor:pointer;animation:float 4s ease-in-out infinite;transition:transform .15s}
.cake>*{position:absolute;left:50%;transform-style:preserve-3d}
.tier{border-radius:18px 18px 22px 22px;box-shadow:0 12px 0 rgba(0,0,0,.18),inset 0 -14px 0 rgba(0,0,0,.1)}
.t1{width:250px;height:80px;bottom:18px;margin-left:-125px;background:var(--pink);transform:translateZ(0)}
.t2{width:180px;height:70px;bottom:92px;margin-left:-90px;background:#ffd1e0;transform:translateZ(30px)}
.t3{width:116px;height:60px;bottom:155px;margin-left:-58px;background:var(--mint);transform:translateZ(60px)}
.tier::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;border-radius:18px 18px 0 0;background:var(--cream);
-webkit-mask:radial-gradient(circle 10px at 10px 12px,#000 98%,transparent) 0 0/26px 100%;mask:radial-gradient(circle 10px at 10px 12px,#000 98%,transparent) 0 0/26px 100%;box-shadow:none}
.plate{width:290px;height:22px;bottom:0;margin-left:-145px;border-radius:50%;background:#e9dcc8;transform:translateZ(0);box-shadow:0 14px 24px rgba(0,0,0,.45)}
.candle{width:8px;height:34px;bottom:214px;margin-left:-4px;background:repeating-linear-gradient(180deg,#fff 0 6px,var(--pink) 6px 12px);border-radius:3px;transform:translateZ(80px)}
.flame{position:absolute;left:50%;top:-20px;width:14px;height:20px;margin-left:-7px;background:radial-gradient(circle at 50% 70%,#fff6c0,var(--gold) 55%,#ff7a3c);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;animation:flick .25s infinite alternate;box-shadow:0 0 18px 6px rgba(255,200,80,.6)}
.candle.b{margin-left:-30px;bottom:212px}.candle.c{margin-left:22px;bottom:212px}
@keyframes flick{to{transform:scale(1.1,.92) rotate(4deg)}}
@keyframes float{50%{margin-top:-10px}}
.hint{font-size:1.1rem;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.5}}
/* kartu */
#card{background:rgba(10,4,24,.78);z-index:5}
.cardwrap{perspective:1000px}
.card{transform-style:preserve-3d;width:min(88vw,360px);padding:20px 20px 24px;border-radius:26px;background:linear-gradient(145deg,#fff4e6,#ffe1ec);color:var(--ink);box-shadow:0 30px 60px rgba(0,0,0,.55);transition:transform .15s;animation:enter 1.1s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes enter{from{transform:rotateY(100deg) rotateX(25deg) scale(.3);opacity:0}}
.photo{position:relative;width:200px;height:200px;margin:0 auto 14px;border-radius:50%;border:6px solid var(--gold);overflow:hidden;background:#f3d3e0;transform:translateZ(50px);box-shadow:0 14px 26px rgba(0,0,0,.35)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;font-size:.95rem;color:#8a4a68}
.card h2{font-family:'Pacifico',cursive;font-weight:400;font-size:1.8rem;margin:0 0 8px;color:#c0396b;transform:translateZ(40px)}
.card .msg{min-height:7.5em;font-size:1.05rem;line-height:1.5;margin:0;transform:translateZ(25px);text-align:center}
.card small{display:block;margin-top:10px;opacity:.6;transform:translateZ(15px)}
.again{margin-top:18px;font-size:.95rem;padding:9px 20px}
/* objek 3D saat kue diketuk */
.objs{position:absolute;inset:0;pointer-events:none;overflow:hidden;perspective:800px}
.cardwrap,.again{position:relative;z-index:1}
.balloon{position:absolute;bottom:-120px;width:54px;height:68px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.8),transparent 28%),var(--c);box-shadow:inset -8px -10px 16px rgba(0,0,0,.25);animation:rise var(--d) ease-in forwards,sway 2s ease-in-out infinite alternate}
.balloon::before{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid var(--c)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:55px;margin-top:7px;background:rgba(255,255,255,.6)}
@keyframes rise{to{translate:0 -140vh}}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.cubebox{position:absolute;width:64px;height:64px;transform-style:preserve-3d;animation:spin 7s linear infinite}
.cubebox i{position:absolute;inset:0;border:3px solid rgba(255,255,255,.5);background:linear-gradient(90deg,transparent 38%,var(--gold) 38% 62%,transparent 62%),linear-gradient(0deg,transparent 38%,var(--gold) 38% 62%,transparent 62%),var(--c)}
.cubebox i:nth-child(1){transform:translateZ(32px)}.cubebox i:nth-child(2){transform:rotateY(180deg) translateZ(32px)}
.cubebox i:nth-child(3){transform:rotateY(90deg) translateZ(32px)}.cubebox i:nth-child(4){transform:rotateY(-90deg) translateZ(32px)}
.cubebox i:nth-child(5){transform:rotateX(90deg) translateZ(32px)}.cubebox i:nth-child(6){transform:rotateX(-90deg) translateZ(32px)}
@keyframes spin{from{transform:rotateX(-25deg) rotateY(0)}to{transform:rotateX(-25deg) rotateY(360deg)}}
.fall{position:absolute;top:-60px;font-size:28px;animation:drop var(--d) linear var(--w) infinite,tumble 2.4s linear infinite}
@keyframes drop{to{translate:0 115vh}}
@keyframes tumble{to{transform:rotateY(360deg) rotateX(180deg)}}
/* toolbar & halaman album */
#card{padding-bottom:84px}
.page{width:100%;max-height:100%;overflow-y:auto;display:flex;justify-content:center;padding:6px 0}
.off{display:none!important}
.bar{position:absolute;left:50%;translate:-50% 0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);z-index:3}
.tab{background:transparent;color:var(--cream);box-shadow:none;padding:9px 16px;font-size:.95rem}
.tab:active{transform:none;box-shadow:none}
.tab.on{background:var(--gold);color:var(--ink)}
.inAlbum .objs{opacity:.25;transition:opacity .4s}
.album{width:min(92vw,380px)}
.poster{position:relative;width:100%;aspect-ratio:4/5;max-height:58vh;border-radius:18px;overflow:hidden;background:#7a1f2b;box-shadow:0 24px 50px rgba(0,0,0,.55);transition:transform .15s}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(120,20,30,.2),rgba(150,40,30,.5) 55%,rgba(110,22,28,.9))}
.pt{position:absolute;top:14px;left:0;right:0;text-align:center;z-index:1;font-family:Georgia,serif;font-size:.85rem}
.pb{position:absolute;left:0;right:0;bottom:0;padding:0 18px 18px;text-align:center;z-index:1}
.pb h3{font-family:'Pacifico',cursive;font-weight:400;font-size:2rem;margin:0 0 6px;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.5)}
.pb p{margin:0 0 8px;font-family:Georgia,serif;font-size:.9rem}
.link{background:none;box-shadow:none;color:#fff;text-decoration:underline;font-family:Georgia,serif;font-size:.85rem;padding:4px 8px}
.link:active{transform:none;box-shadow:none}
.player{margin-top:12px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px)}
.pinfo{display:flex;align-items:center;gap:10px;text-align:left;margin-bottom:8px}
.pinfo b{display:block;color:var(--gold)}.pinfo span{display:block;font-size:.85rem;opacity:.8}
.disc{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--gold);overflow:hidden;background:var(--pink);animation:rot 5s linear infinite;animation-play-state:paused}
.disc.playing{animation-play-state:running}
.disc img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes rot{to{transform:rotate(360deg)}}
#seek{width:100%;margin:0;padding:0;accent-color:var(--gold);background:none}
.time{display:flex;justify-content:space-between;font-size:.8rem;opacity:.8}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:6px}
.ctl button{width:44px;height:44px;padding:0;font-size:1rem}
.ctl #play{width:54px;height:54px;font-size:1.3rem}
#list{list-style:none;margin:8px 0 0;padding:0;text-align:left}
#list button{width:100%;text-align:left;background:transparent;color:var(--cream);box-shadow:none;border-radius:12px;padding:6px 12px;font-size:.9rem}
#list button:active{transform:none}
#list .on button{background:rgba(255,207,107,.22);color:var(--gold)}
canvas{position:fixed;inset:0;pointer-events:none;z-index:10}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>

<!-- 1. LOGIN -->
<section class="screen" id="login">
  <h1>Birthday</h1>
  <p>Masuk dulu ya haha user:bocil pw:151108</p>
  <div class="box">
    <input id="u" placeholder="Username" autocomplete="off">
    <input id="p" type="password" placeholder="Password" autocomplete="off">
    <p id="err" role="alert"></p>
    <button id="go">Masuk</button>
  </div>
</section>

<!-- 2. KUE -->
<section class="screen hidden" id="cakeScreen">
  <h1 id="title"></h1>
  <div class="stage"><div class="cake" id="cake" tabindex="0" role="button" aria-label="Buka kue ulang tahun">
    <div class="plate"></div>
    <div class="tier t1"></div><div class="tier t2"></div><div class="tier t3"></div>
    <div class="candle b"><i class="flame"></i></div><div class="candle"><i class="flame"></i></div><div class="candle c"><i class="flame"></i></div>
  </div></div>
  <p class="hint">Ketuk kuenya wkwk ^-^</p>
</section>

<!-- 3. KARTU -->
<section class="screen hidden" id="card">
  <div class="objs" id="objs"></div>
  <div class="page" id="pgMsg">
  <div class="cardwrap"><div class="card" id="c3d">
    <!-- GANTI "foto.jpg" dengan nama file fotomu (taruh di folder yang sama dengan file ini) -->
    <div class="photo"><img src="nanadbocil.jpeg" alt="Foto"></div>
    <h2 id="hb"></h2>
    <p class="msg" id="msg"></p>
  </div></div>
  </div>

  <!-- HALAMAN ALBUM LAGU -->
  <div class="page off" id="pgAlbum"><div class="album">
    <div class="poster" id="poster">
      <img id="pFoto" alt="">
      <div class="pt" id="pDate"></div>
      <div class="pb"><h3 id="pTitle"></h3><p id="pSub"></p></div>
    </div>
    <div class="player">
      <div class="pinfo"><div class="disc" id="disc"><img id="cover" alt=""></div><div><b id="tTitle"></b><span id="tArtist"></span></div></div>
      <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Posisi lagu">
      <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      <div class="ctl"><button id="prev" aria-label="Sebelumnya">⏮</button><button id="play" aria-label="Putar atau jeda">▶</button><button id="next" aria-label="Berikutnya">⏭</button></div>
      <ol id="list"></ol>
    </div>
  </div></div>

  <!-- TOOLBAR -->
  <nav class="bar" aria-label="Menu">
    <button class="tab on" data-p="Msg">💌 Ucapan</button>
    <button class="tab" data-p="Album">🎵 Album</button>
    <button class="tab" data-p="Cake">🎂 Kue</button>
  </nav>
</section>

<canvas id="fx"></canvas>

<script>
/* ====== UBAH BAGIAN INI ====== */
const NAMA   = "Love Of My Life";
const USER   = "bocil";
const PASS   = "151108";
const PESAN  = "Happy Birthday nanad sayangku cintakuu yang amat cantik gemesh and lusyuuu, selamat bertambah umur semoga yang kamu pengen semua kesampean , semoga kamu rajin kuliah, berbakti pada org tua, semoga selalu deberi kebahagiaan selalu senyum, dan semoga selalu sayang sama aku hahaa, semoga dgn + usia marah' kamu jadi berkurang hehe, I will always be the first person to see you happy. I love you so much always... 🤍🤍🤍🤍🤍";
// Halaman album (kartu foto + teks)
const POSTER = { foto:"duobos.jpeg", tanggal:"", judul:"I love you, Love!", teks:"Always proud of you, always here with you." };

// Daftar lagu album: taruh file mp3 & gambar cover di folder yang sama.
// Mau tambah lagu? salin satu baris { ... }, lalu ganti isinya.
const LAGU = [
  { judul:"Mirrors", artis:"Justin Timberlake", file:"song1.mp3", cover:"album1.jpeg" },
  { judul:"You",   artis:"Lany", file:"song2.mp3", cover:"album2.jpeg" },
  { judul:"Just the Way You Are ",  artis:"Bruno Mars", file:"song3.mp3", cover:"album3.jpeg" }
];
/* ============================= */
const $=id=>document.getElementById(id);
const show=id=>["login","cakeScreen","card"].forEach(s=>$(s).classList.toggle("hidden",s!==id));
$("title").textContent="Untuk "+NAMA;
$("hb").textContent="Selamat Ulang Tahun, "+NAMA+"!";

function login(){
  if($("u").value.trim().toLowerCase()===USER&&$("p").value===PASS){$("err").textContent="";show("cakeScreen")}
  else $("err").textContent="Nama pengguna atau kata sandi salah. Coba lagi.";
}
$("go").onclick=login;
["u","p"].forEach(i=>$(i).addEventListener("keydown",e=>e.key==="Enter"&&login()));

/* tilt 3D */
function tilt(el,range){
  const move=(x,y)=>{const r=el.getBoundingClientRect(),dx=(x-r.left-r.width/2)/r.width,dy=(y-r.top-r.height/2)/r.height;
    el.style.transform=`rotateY(${dx*range}deg) rotateX(${-dy*range}deg)`};
  addEventListener("mousemove",e=>move(e.clientX,e.clientY));
  addEventListener("touchmove",e=>move(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
}
tilt($("cake"),40);tilt($("c3d"),28);

/* objek 3D: balon, kado berputar, hujan hati & bintang */
function objects(){
  const o=$("objs"),R=Math.random,cols=["#ff8fb1","#7de0c4","#ffcf6b","#9d7bff","#ff7a5c"];o.innerHTML="";
  for(let i=0;i<9;i++){const b=document.createElement("div");b.className="balloon";
    b.style.cssText=`left:${5+R()*85}%;--c:${cols[i%5]};--d:${6+R()*5}s;animation-delay:${R()*1.5}s,0s`;o.appendChild(b)}
  [["6%","14%","#ff8fb1"],["78%","62%","#7de0c4"],["10%","70%","#9d7bff"]].forEach(p=>{
    const c=document.createElement("div");c.className="cubebox";c.style.cssText=`left:${p[0]};top:${p[1]};--c:${p[2]}`;
    c.innerHTML="<i></i><i></i><i></i><i></i><i></i><i></i>";o.appendChild(c)});
  const em=["💖","⭐","✨","🎁","💜","🎈"];
  for(let i=0;i<14;i++){const f=document.createElement("span");f.className="fall";f.textContent=em[i%6];
    f.style.cssText=`left:${R()*95}%;--d:${5+R()*5}s;--w:-${R()*8}s`;o.appendChild(f)}
}

/* buka kejutan */
let timer;
function typeText(t){const m=$("msg");m.textContent="";let i=0;clearInterval(timer);
  timer=setInterval(()=>{m.textContent+=t[i++]||"";if(i>t.length)clearInterval(timer)},45)}
function openGift(){
  show("card");showPage("Msg");objects();burst();setTimeout(burst,500);
  const c=$("c3d");c.style.animation="none";void c.offsetWidth;c.style.animation="";
  setTimeout(()=>typeText(PESAN),700);
}
$("cake").onclick=openGift;
$("cake").addEventListener("keydown",e=>(e.key==="Enter"||e.key===" ")&&openGift());

/* toolbar */
function showPage(p){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.p===p));
  $("pgMsg").classList.toggle("off",p!=="Msg");
  $("pgAlbum").classList.toggle("off",p!=="Album");
  $("card").classList.toggle("inAlbum",p==="Album");
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  if(t.dataset.p==="Cake"){clearInterval(timer);show("cakeScreen")}else showPage(t.dataset.p)});

/* pemutar lagu */
const au=new Audio();let ti=0;
const fmt=n=>isFinite(n)?Math.floor(n/60)+":"+String(Math.floor(n%60)).padStart(2,"0"):"0:00";
LAGU.forEach((t,i)=>{const li=document.createElement("li");li.innerHTML="<button></button>";
  li.firstChild.textContent=(i+1)+". "+t.judul+" - "+t.artis;
  li.firstChild.onclick=()=>{load(i);au.play().catch(()=>{})};$("list").appendChild(li)});
function load(i){
  ti=(i+LAGU.length)%LAGU.length;const t=LAGU[ti];
  au.src=t.file;$("cover").src=t.cover;$("tTitle").textContent=t.judul;$("tArtist").textContent=t.artis;
  [...$("list").children].forEach((li,k)=>li.classList.toggle("on",k===ti));
  $("seek").value=0;$("cur").textContent="0:00";$("dur").textContent="0:00";
}
load(0);
$("pFoto").src=POSTER.foto;$("pDate").textContent=POSTER.tanggal;$("pTitle").textContent=POSTER.judul;$("pSub").textContent=POSTER.teks;
tilt($("poster"),12);
$("play").onclick=()=>au.paused?au.play().catch(()=>{}):au.pause();
$("prev").onclick=()=>{load(ti-1);au.play().catch(()=>{})};
$("next").onclick=()=>{load(ti+1);au.play().catch(()=>{})};
au.onplay=()=>{$("disc").classList.add("playing");$("play").textContent="⏸"};
au.onpause=()=>{$("disc").classList.remove("playing");$("play").textContent="▶"};
au.onloadedmetadata=()=>$("dur").textContent=fmt(au.duration);
au.ontimeupdate=()=>{$("cur").textContent=fmt(au.currentTime);if(au.duration)$("seek").value=au.currentTime/au.duration*100};
au.onended=()=>{load(ti+1);au.play().catch(()=>{})};
$("seek").oninput=e=>{if(au.duration)au.currentTime=e.target.value/100*au.duration};

/* confetti */
const cv=$("fx"),cx=cv.getContext("2d");let ps=[],run=false;
const size=()=>{cv.width=innerWidth;cv.height=innerHeight};size();addEventListener("resize",size);
function burst(){
  const cols=["#ffcf6b","#ff8fb1","#7de0c4","#fff4e6","#9d7bff"];
  for(let i=0;i<110;i++)ps.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*15-3,s:Math.random()*8+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%5]});
  if(!run){run=true;loop()}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  ps=ps.filter(p=>p.y<cv.height+20);
  ps.length?requestAnimationFrame(loop):(run=false,cx.clearRect(0,0,cv.width,cv.height));
}
</script>
</body>
</html>
